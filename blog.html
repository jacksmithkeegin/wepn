---
layout: default
title: Blog - WEPN
---

<section class="container">
  <h1 data-i18n="nav.blog">Blog</h1>
  <div class="posts-list">
    {% assign posts = site.data.posts | sort: 'sort_date' | reverse %}
    {% for post in posts %}
      <article id="post-{{ post.slug }}" class="post-item full-post">
        <header class="post-header">
          <h2>
            <span data-lang="en">{{ post.title.en }}</span>
            <span data-lang="cy" style="display:none;">{{ post.title.cy }}</span>
          </h2>
          <time class="post-date">
            <span data-lang="en">{{ post.date.en }}</span>
            <span data-lang="cy" style="display:none;">{{ post.date.cy }}</span>
          </time>
        </header>
        <div class="post-body">
          <div data-lang="en">{{ post.body.en | markdownify }}</div>
          <div data-lang="cy" style="display:none;">{{ post.body.cy | markdownify }}</div>
        </div>
      </article>
    {% endfor %}
  </div>
</section>
